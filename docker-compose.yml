# Production shape (TSD Section 9.3).
#
# T-2 binding rules:
#   - the gateway publishes to 127.0.0.1 only; public reach is via nginx
#   - gateway-db publishes NO host port, and is reachable only on the compose network
#
# Docker note: Docker writes its own iptables rules and bypasses ufw for published
# ports. That is harmless here because the only publish is on loopback - but any
# future `ports:` entry must be checked against the DOCKER-USER chain, because the
# ufw "belt" will not hold it.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: energiup/mcp-gateway:0.1.0
    env_file: .env
    environment:
      PORT: 8787
      BIND_ADDRESS: 0.0.0.0 # inside the container only; the publish below is loopback
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Signing key mounted read-only from the host vault.
      - ./secrets/oauth_signing.pem:/app/secrets/oauth_signing.pem:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - gateway_pgdata:/var/lib/postgresql/data
    # No ports: section - compose network only (T-2).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Nightly pg_dump to /opt/backups/mcp-gateway with 14-day retention.
  # TSD Section 11 requires this; the implementation guide never created it, so it
  # would not have existed at go-live (review H10).
  #
  # An off-host copy is still required: same-host backups die with the host, and the
  # rollback ladder explicitly contemplates rebuilding it. Sync /opt/backups to OSS,
  # and TEST A RESTORE - an untested backup is not a backup.
  backup:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-/opt/backups/mcp-gateway}:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

volumes:
  gateway_pgdata: {}
