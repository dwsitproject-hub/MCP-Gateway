# =====================================================================
# /etc/nginx/conf.d/mcp.conf
#
# nginx.org mainline uses conf.d/*.conf, NOT sites-enabled/ (T-9).
# After every nginx package update, verify:
#     sudo nginx -T | grep -A2 "server_name <gateway-hostname>"
#
# Review fixes applied in this file:
#   B7  limit_req_status 429 - the default is 503, so the Stage 5.5 smoke test
#       ("expect 429s") would have failed against a correctly working limiter.
#   B7  nginx is now the ANTI-ABUSE FLOOR, not the business limit. Every request
#       arrives from Anthropic's shared egress range, so $binary_remote_addr puts
#       the entire pilot in ONE bucket. The real per-user limit is the token
#       bucket in the app, keyed on the OAuth subject. Tight limits are kept where
#       brute force actually lives: /authorize, /token, /register.
#   H3  Anthropic publishes its egress range (160.79.104.0/21) and the connector
#       docs recommend allow-listing it. /mcp and /token are locked to it; the
#       /authorize leg runs in the user's BROWSER and so is limited to corporate
#       egress instead. See the ALLOWLIST block below.
#   H9  X-Forwarded-For / X-Real-IP are set, otherwise every audit row records
#       127.0.0.1 and the audit log cannot answer the question it exists for.
#   B5  X-Accel-Buffering is passed through for SSE responses.
#   Med A catch-all server rejects TLS on the bare EIP and unknown Host values,
#       instead of serving this certificate to anything that connects.
# =====================================================================

# --- rate limit zones -------------------------------------------------
# /mcp: generous. This is abuse protection, not the per-user quota.
limit_req_zone $binary_remote_addr zone=mcp_floor:10m rate=10r/s;
# OAuth endpoints: tight. A password form and a token endpoint are what get
# brute-forced, and these are reached by individual users, not the egress pool.
limit_req_zone $binary_remote_addr zone=mcp_auth:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=mcp_conn:10m;

limit_req_status 429;
limit_conn_status 429;

# --- Anthropic egress allowlist (H3) ---------------------------------
# Verify against the real source addresses in access.log during Stage 6 BEFORE
# tightening, then keep a documented break-glass to reopen.
# Source: platform.claude.com/docs/en/api/ip-addresses
geo $anthropic_egress {
    default        0;
    160.79.104.0/21 1;
}

# Corporate egress and VPN ranges that may reach the interactive login page.
# REPLACE these with the real CIDRs before enabling the deny in location /authorize.
geo $corporate_egress {
    default      0;
    10.0.0.0/8   1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

# ---------------------------------------------------------------------
# Catch-all: do not serve the gateway certificate to unknown hosts.
# ---------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
}

# ---------------------------------------------------------------------
# ACME http-01 challenge only.
#
# Only needed if you chose http-01. The recommended path is dns-01, which needs
# NO inbound port 80 at all - and note that certbot --standalone CANNOT WORK with
# the Stage 1.3 firewall, because ufw and the security group both close port 80
# (review B1). If you keep this block, add inbound 80 to BOTH.
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name <gateway-hostname>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
# The gateway
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <gateway-hostname>;

    # --- TLS (S3) ---
    ssl_certificate     /etc/letsencrypt/live/<gateway-hostname>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<gateway-hostname>/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/<gateway-hostname>/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MCPTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No ssl_stapling: Let's Encrypt retired OCSP and no longer puts a responder URL
    # in its certificates, so nginx ignores the directive and warns on every -t and
    # reload. Nothing is lost - there is nothing to staple. Revocation is via CRL.
    #
    # resolver is kept because proxy_pass below uses a variable: needed the moment
    # $upstream becomes a hostname rather than a literal IP.
    resolver 223.5.5.5 223.6.6.6 valid=300s;
    resolver_timeout 5s;

    # --- security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # PRD 6.1 promised a CSP. It matters most on the login page, which the app sets
    # per-response; this is the default for everything else.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    client_max_body_size 64k;
    client_body_timeout 15s;
    server_tokens off;

    access_log /var/log/nginx/mcp.access.log combined;
    error_log  /var/log/nginx/mcp.error.log warn;

    limit_conn mcp_conn 40;

    # --- shared proxy settings ---
    set $upstream http://127.0.0.1:8787;

    # ---- MCP endpoint: Anthropic egress only (H3) --------------------
    location = /mcp {
        # Enable after verifying real source addresses in access.log (Stage 6).
        # if ($anthropic_egress = 0) { return 403; }

        limit_req zone=mcp_floor burst=40 nodelay;

        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";      # streaming-safe

        # SSE / streamed responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        gzip off;
        add_header X-Accel-Buffering no always;
    }

    # ---- OAuth token / registration: server-to-server ---------------
    location ~ ^/(token|register|revoke)$ {
        # if ($anthropic_egress = 0) { return 403; }
        limit_req zone=mcp_auth burst=10 nodelay;

        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- Interactive login: the USER'S BROWSER reaches this ----------
    # It cannot be restricted to Anthropic's range. Restrict it to corporate
    # egress and VPN instead - still far better than 0.0.0.0/0.
    location ^~ /authorize {
        # if ($corporate_egress = 0) { return 403; }
        limit_req zone=mcp_auth burst=10 nodelay;

        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- Discovery metadata: public by necessity --------------------
    location ^~ /.well-known/ {
        limit_req zone=mcp_floor burst=20 nodelay;

        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # ---- Health: liveness is public, detail is internal --------------
    # The app itself only returns detail to private source addresses (H10).
    location = /healthz {
        access_log off;
        proxy_pass $upstream;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /livez {
        access_log off;
        proxy_pass $upstream;
    }

    # Everything else is not part of the gateway's surface.
    location / {
        return 404;
    }
}
